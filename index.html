function geo(){var q=[];locs.forEach(function(l,i){if(l.lat==null&&!l.del)q.push(i)});var n=q.length,k=0,bad=[];if(!n)return;
 (function nx(){if(k>=n){$('gs').textContent=bad.length?'Koordinaten nicht gefunden: '+bad.join(', ')+' (Seite neu laden = erneuter Versuch)':'';return}
  var i=q[k++],l=locs[i];$('gs').textContent='Koordinaten werden einmalig ermittelt: '+k+'/'+n+' (danach gespeichert)';
  var ok=function(j){if(j&&j[0]){l.lat=+j[0].lat;l.lng=+j[0].lon;G[l.name+'|'+l.addr]=[l.lat,l.lng];try{localStorage.setItem(GK,JSON.stringify(G))}catch(e){}mk(i);stat();return true}return false};
  var Q=function(t){return fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=de&q='+encodeURIComponent(t)).then(function(r){return r.json()})};
  Q(l.addr+', '+l.plz+' '+(l.city||'Berlin')).then(function(j){if(ok(j))return;return new Promise(function(r){setTimeout(r,1100)}).then(function(){return Q(l.name+', '+(l.city||'Berlin'))}).then(function(j2){if(ok(j2))return;if(!ALT[l.name]){bad.push(l.name);return}return new Promise(function(r){setTimeout(r,1100)}).then(function(){return Q(ALT[l.name])}).then(function(j3){if(!ok(j3))bad.push(l.name)})})}).catch(function(){bad.push(l.name)}).then(function(){setTimeout(nx,1100)})})()}
var me=null,meM=null,meC=null;
function hav(a,b,c,d){var r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,s=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2);return 12742*Math.asin(Math.sqrt(s))}
function locate(){var n=$('near');n.style.display='block';

  meC=L.circle(me,{radius:p.coords.accuracy,color:'#2980b9',weight:1,fillOpacity:.1}).addTo(map);

 a.sort(function(x,y){return x.d-y.d});a=a.slice(0,10);

 if(a.length)map.fitBounds(L.latLngBounds([me].concat(a.slice(0,3).map(function(x){return[locs[x.i].lat,locs[x.i].lng]}))),{padding:[30,30],maxZoom:15})}
